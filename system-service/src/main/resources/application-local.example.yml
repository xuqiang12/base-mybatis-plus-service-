# 本机文件不打入 JAR；运行时用 spring.config.additional-location 显式加载，见运行说明。
# 复制为 application-local.yml；该本机文件已被 Git 忽略。
# IDEA 程序参数加 --spring.profiles.active=local，密钥路径按实际位置填写。
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/relations
    username: relations
    password: ""
  mail:
    host: smtp.qq.com # 示例：按实际邮箱服务商填写
    port: 465
    username: "" # 发件邮箱完整地址
    password: "" # 开启 SMTP 后取得的授权码，不是网页登录密码
security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:file:./config/jwt-public.pem}
    private-key: ${JWT_PRIVATE_KEY:file:./config/jwt-private.pem}
app:
  email-code:
    from: "" # 通常与 spring.mail.username 相同
    code-secret: "" # 独立随机密钥，至少 32 字节；不可复用邮箱授权码
  bootstrap-admin:
    username: admin
    email: ""
    phone: ""
    password: "" # 首次空库初始化；8 至 72 字符且 UTF-8 不超过 72 字节
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
