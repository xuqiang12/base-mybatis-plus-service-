spring:
  application:
    name: system-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/relations}
    username: ${DB_USERNAME:relations}
    password: ${DB_PASSWORD:}
  flyway:
    default-schema: relations
    schemas: relations
    locations: classpath:db/system
  jackson:
    time-zone: Asia/Shanghai
    deserialization:
      accept-float-as-int: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLED:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLED:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS_ENABLED:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  port: ${SERVER_PORT:8000}
  forward-headers-strategy: none
security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:file:./config/jwt-public.pem}
    private-key: ${JWT_PRIVATE_KEY:file:./config/jwt-private.pem}
    issuer: system-service
    ttl: 7d
  public-endpoints:
    post:
      - /auth/login
      - /auth/email/code
      - /auth/email/register
app:
  email-code:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    code-secret: ${EMAIL_CODE_SECRET:}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    phone: ${BOOTSTRAP_ADMIN_PHONE:}
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
