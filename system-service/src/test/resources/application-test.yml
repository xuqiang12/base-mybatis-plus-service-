spring:
  datasource:
    url: jdbc:h2:mem:identity;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
security:
  jwt:
    public-key: classpath:keys/test-public.pem
    private-key: classpath:keys/test-private.pem
logging:
  level:
    com.base.common.web.RequestLogFilter: WARN
