# 本机文件不打入 JAR；运行时用 spring.config.additional-location 显式加载，见运行说明。
# 复制为 application-local.yml，程序参数加 --spring.profiles.active=local。
# 使用统一管理服务对应的公钥；亲友服务不配置私钥或身份权限数据库。
security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:file:./config/jwt-public.pem}
  identity:
    access-url: http://localhost:8080/auth/access
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
